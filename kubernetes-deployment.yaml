apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice
  template:
    metadata:
      labels:
        app: microservice
    spec:
      containers:
        - name: microservice
          image: your-docker-registry/microservice:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092" # Replace with your Kafka service name
            - name: KAFKA_TOPIC_INPUT
              value: "test_IN"
            - name: KAFKA_TOPIC_OUTPUT
              value: "test_OUT"
            - name: app.threadpool.size
              value: "10"

--- # Separator for the Service definition

apiVersion: v1
kind: Service
metadata:
  name: microservice-service
spec:
  selector:
    app: microservice
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer